[package]
name = "fusion-link"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
description = "Local-first connection daemon: outbound WSS to cloud broker, task relay to local fusion-gateway"

[lib]
name = "fusion_link"
path = "src/lib.rs"

[[bin]]
name = "fusion-link"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
tokio-util = "0.7"
dirs = "5"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
